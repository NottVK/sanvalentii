# Arma el juego y lo publica, sirva GitHub Pages desde Actions o desde la rama:
#  - deja la versión lista para jugar en la raíz del repo (modo "Deploy from a branch")
#  - y además la publica con deploy-pages (modo "GitHub Actions")
name: Armar y publicar el juego

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  armar:
    # No se vuelve a ejecutar por su propio commit
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Dejar el juego armado en la raíz del repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html juego assets .nojekyll
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar el juego publicado [skip ci]"
            git push
          fi

      - name: Juntar los archivos de la página
        run: |
          mkdir -p sitio
          cp -r index.html juego assets .nojekyll sitio/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  publicar:
    needs: armar
    runs-on: ubuntu-latest
    # Si Pages está configurado como "Deploy from a branch", este paso no aplica y se ignora
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
