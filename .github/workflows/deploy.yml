# Arma el juego y deja la versión lista para jugar en la raíz del repo,
# que es lo que publica GitHub Pages (Deploy from a branch: main / root).
name: Armar el juego

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  armar:
    # No se vuelve a ejecutar por su propio commit
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Subir el juego armado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html juego assets .nojekyll
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "Actualizar el juego publicado [skip ci]"
          git push
